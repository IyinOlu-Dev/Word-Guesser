<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon-512.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Word Guesser</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314212b'/%3E%3Crect x='6' y='24' width='16' height='16' rx='3' fill='%2312806a'/%3E%3Crect x='24' y='24' width='16' height='16' rx='3' fill='%23e0a526'/%3E%3Crect x='42' y='24' width='16' height='16' rx='3' fill='%2366737f'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#14212b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Word Guesser">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121a21">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Word Guesser">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="game">
        <header>
            <h1>Word Guesser</h1>
            <p id="subtitle">Loading a word…</p>
        </header>

        <div id="grid" role="grid" aria-label="Guess board"></div>

        <section id="result" hidden aria-live="polite">
            <p id="result-text"></p>
            <button id="restart-btn" type="button">Play again</button>
        </section>

        <div id="keyboard" aria-label="On-screen keyboard"></div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
</body>
</html>
